<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantrixUI</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- Sekmenin simgesi, demonun her platformdaki simgesi: mavi kare üstünde P. SVG'yi okuyan tarayıcı onu, okumayan
         ICO'yu alır; iOS ana ekrana eklenen sayfa için kendi köşelerini kestiği kare simgeyi. Yollar göreli: demo bir
         alt yolda da çalışır. -->
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Uygulamanın yazı tipleri, kodu inerken indirilir: uygulama onları istediğinde hazırdır. Adresler, Compose'un
         kaynak okuyucusunun istediği adreslerdir; `crossorigin` olmadan tarayıcı bu indirmeleri o isteklere saymaz.
         İlki kütüphanenin kendi yazı tipi, ikincisi onun yedeği Pantrix Symbols (Mac tuşlarının işaretleri), ötekiler
         uygulamanın "Ayarlar"da seçilen iki yazı tipinin dosyaları. Liste font klasörleriyle aynı kalmalıdır
         (WebFontPreloadTest). -->
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.foundation.generated.resources/font/plus_jakarta_sans.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.foundation.generated.resources/font/pantrix_symbols.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_bold.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_extrabold.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_extralight.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_light.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_medium.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_regular.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/plusjakartasans_semibold.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_black.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_bold.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_extra_bold.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_light.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_medium.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_regular.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/pantrixui.app.shared.generated.resources/font/poppins_thin.ttf">
</head>
<body>
    <!-- Yükleme işareti: uygulamanın ilk karesi çizilene dek üstünde durur, sonra kaldırılır (main.kt). -->
    <div id="loading">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
            <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <!-- Uygulamanın kurulduğu kutu. -->
    <div id="app"></div>
    <!-- Demoyu tarayıcının çalıştırabildiği sürümüyle başlatır: Wasm, ya da Wasm'ı çalıştıramayan bir tarayıcıda
         JavaScript. -->
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
